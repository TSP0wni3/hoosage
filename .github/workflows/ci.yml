name: Verify and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: hoosage-vsix
          path: hoosage.vsix
